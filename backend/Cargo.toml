[package]
name = "photo-maps-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "HTTP API for Photo Maps: photos, places, uploads, share cards, RSS and email."
publish = false

[dependencies]
anyhow = "1.0.104"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-sdk-s3 = "1.152.0"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
emojis = "0.9.0"
fast_image_resize = "6.1.0"
harfrust = "0.12.0"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
kamadak-exif = "0.6.1"
lcms2 = "6.2.0"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
mozjpeg = "0.10.13"
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "system-proxy"] }
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
skrifa = "0.44.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "macros"] }
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["trace", "catch-panic", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tower = { version = "0.5.3", features = ["util"] }

# Image decoding, resizing and rasterizing are unusably slow unoptimized; build
# dependencies with optimizations even in dev and test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
