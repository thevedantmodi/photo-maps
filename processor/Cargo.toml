  [package]
  name = "photo-maps-processor"
  version = "0.1.0"
  edition = "2021"

  [lib]
  crate-type = ["cdylib", "rlib"]

  [dependencies]
  worker = "0.8.5"
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"
  kamadak-exif = "0.5"
  image = { version = "0.25", default-features = false, features = ["jpeg",
  "png"] }
  fast_image_resize = { version = "5", features = ["image"] }

  [profile.release]
  opt-level = 3
